[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "AI assistant that lives on your Windows laptop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ddgs>=9",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.2",
    "ollama>=0.4",
    "prompt_toolkit>=3.0",
    "psutil>=5.9",
    "send2trash>=1.8",
    "pycaw>=20240210",
    "elevenlabs>=2.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "keyboard>=0.13",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
jarvis = ["llm/prompts/*.md"]
